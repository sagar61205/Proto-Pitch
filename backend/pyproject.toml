[project]
name = "protopitch"
version = "0.1.0"
description = "ProtoPitch platform backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.7,<3",
    "sqlalchemy>=2.0.30,<3",
    "alembic>=1.13,<2",
    "pyyaml>=6,<7",
]

[project.scripts]
protopitch = "protopitch.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["protopitch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs a running Docker daemon and the built sandbox image"]
addopts = "-m 'not docker' -q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["protopitch/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "T20"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "T20", "E501"]
# Paths inside the container, not on the host.
"protopitch/sandbox/docker.py" = ["S108"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["protopitch"]
exclude = ["protopitch/db/migrations/"]
